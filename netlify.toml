[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter @workspace/super-tv... run build"
  publish = "artifacts/super-tv/dist/public"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"

# Proxy API calls to the backend (set VITE_API_URL as Netlify env var)
[[redirects]]
  from = "/api/*"
  to = "https://3001-224c72ab-64dd-4885-81f6-4daa03d8042e-00-lylx8na8p6qi.janeway.replit.dev/api/:splat"
  status = 200
  force = true
  headers = {X-From-Netlify = "1"}

# SPA fallback — all non-asset routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
